# Constructed on 2026-08-31 11:25:40 from: 01_general.conf, 02_bindings.conf, 03_theme.conf

set-option -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Change prefix
unbind C-Space

set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

bind "\\" split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Monochrome palette: black surfaces, white highlights, muted gray details.
set -g cursor-style block

set-option -g status-style 'bg=default,fg=#e5e5e5'

set-option -g status-justify centre
set-option -g status-left '#[fg=#ffffff,bg=default] 🚀'
set-option -g status-left-length 16

set-window-option -g window-status-format '#[bg=default,fg=#888888]  #I #W  '
set-window-option -g window-status-current-format '#[fg=#101010,bg=#ffffff]  [#I] #W  '

set-option -g status-right '#[bg=default,fg=#d4d4d4] %a %b %d %l:%M %p #[bg=default] #[]'
set-option -g status-interval 60

set-option -g pane-active-border-style fg=#ffffff
set-option -g pane-border-style fg=#4a4a4a

set -g message-style 'bg=#242424,fg=#ffffff'
set -g message-command-style 'bg=#242424,fg=#ffffff'
