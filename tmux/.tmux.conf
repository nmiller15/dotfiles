# Constructed on 2026-11-16 22:00:24 from: 01_general.conf, 02_bindings.conf, 03_theme.conf

set-option -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Change prefix
unbind C-Space

set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

bind "\\" split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Slate palette: subdued gray status bar with an icy blue active window.
set -g cursor-style block

set-option -g status-style 'bg=default,fg=#949494'

set-option -g status-justify centre
set-option -g status-left '#[fg=#737373,bg=default] Phil 2:3'
set-option -g status-left-length 16

set-window-option -g window-status-format '#[bg=default,fg=#737373]  #I #W  '
set-window-option -g window-status-current-format '#[bg=default,fg=#89a7b1]  [#I] #W  '

set-option -g status-right '#[bg=default,fg=#949494] %a %b %d %l:%M %p #[bg=default] #[]'
set-option -g status-interval 60

set-option -g pane-active-border-style fg=#89a7b1
set-option -g pane-border-style fg=#535353

set -g message-style 'bg=#212121,fg=#d5d5d5'
set -g message-command-style 'bg=#212121,fg=#d5d5d5'
