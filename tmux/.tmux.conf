# Constructed on 2026-08-31 11:25:40 from: 01_general.conf, 02_bindings.conf, 03_theme.conf

set-option -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Change prefix
unbind C-Space

set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

bind "\\" split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vague palette: dark surfaces, muted text, soft rose and seafoam accents.
set -g cursor-style block

set-option -g status-style 'bg=#1c1c24,fg=#cdcdcd'

set-option -g status-justify centre
set-option -g status-left '#[fg=#c48282,bg=#1c1c24] 🚀'
set-option -g status-left-length 16

set-window-option -g window-status-format '#[bg=#1c1c24,fg=#878787]  #I #W  '
set-window-option -g window-status-current-format '#[fg=#141415,bg=#b4d4cf]  [#I] #W  '

set-option -g status-right '#[bg=#252530,fg=#c3c3d5] %a %b %d %l:%M %p #[bg=#1c1c24] #[]'
set-option -g status-interval 60

set-option -g pane-active-border-style fg=#b4d4cf
set-option -g pane-border-style fg=#606079

set -g message-style 'bg=#405065,fg=#cdcdcd'
set -g message-command-style 'bg=#405065,fg=#cdcdcd'
