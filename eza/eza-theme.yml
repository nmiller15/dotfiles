# Noirbuddy Slate: primary #89A7B1, secondary #566981, and noir grays.
# Keep red for errors so conflicts and broken links remain easy to spot.

colourful: true

filekinds:
  normal: {foreground: "#d5d5d5"}
  directory: {foreground: "#f5f5f5", is_bold: false}
  symlink: {foreground: "#89a7b1"}
  pipe: {foreground: "#949494"}
  block_device: {foreground: "#89a7b1"}
  char_device: {foreground: "#89a7b1"}
  socket: {foreground: "#566981"}
  special: {foreground: "#89a7b1"}
  executable: {foreground: "#89a7b1"}
  mount_point: {foreground: "#d5d5d5"}

perms:
  user_read: {foreground: "#f5f5f5", is_bold: false}
  user_write: {foreground: "#89a7b1"}
  user_execute_file: {foreground: "#89a7b1"}
  user_execute_other: {foreground: "#89a7b1"}
  group_read: {foreground: "#f5f5f5", is_bold: false}
  group_write: {foreground: "#89a7b1"}
  group_execute: {foreground: "#89a7b1"}
  other_read: {foreground: "#d5d5d5"}
  other_write: {foreground: "#89a7b1"}
  other_execute: {foreground: "#89a7b1"}
  special_user_file: {foreground: "#89a7b1"}
  special_other: {foreground: "#566981"}
  attribute: {foreground: "#d5d5d5"}

size:
  major: {foreground: "#d5d5d5"}
  minor: {foreground: "#89a7b1"}
  number_byte: {foreground: "#f5f5f5", is_bold: false}
  number_kilo: {foreground: "#d5d5d5"}
  number_mega: {foreground: "#89a7b1"}
  number_giga: {foreground: "#89a7b1"}
  number_huge: {foreground: "#89a7b1"}
  unit_byte: {foreground: "#d5d5d5"}
  unit_kilo: {foreground: "#89a7b1"}
  unit_mega: {foreground: "#89a7b1"}
  unit_giga: {foreground: "#89a7b1"}
  unit_huge: {foreground: "#89a7b1"}

users:
  user_you: {foreground: "#f5f5f5", is_bold: false}
  user_root: {foreground: "#566981"}
  user_other: {foreground: "#89a7b1"}
  group_yours: {foreground: "#d5d5d5"}
  group_other: {foreground: "#566981"}
  group_root: {foreground: "#566981"}

links:
  normal: {foreground: "#89a7b1"}
  multi_link_file: {foreground: "#89a7b1"}

git:
  new: {foreground: "#d5d5d5"}
  modified: {foreground: "#89a7b1"}
  deleted: {foreground: "#566981"}
  renamed: {foreground: "#89a7b1"}
  typechange: {foreground: "#89a7b1"}
  ignored: {foreground: "#566981"}
  conflicted: {foreground: "#ff8a80"}

git_repo:
  branch_main: {foreground: "#f5f5f5", is_bold: false}
  branch_other: {foreground: "#89a7b1"}
  git_clean: {foreground: "#89a7b1"}
  git_dirty: {foreground: "#ff8a80"}

security_context:
  colon: {foreground: "#89a7b1"}
  user: {foreground: "#d5d5d5"}
  role: {foreground: "#89a7b1"}
  typ: {foreground: "#566981"}
  range: {foreground: "#89a7b1"}

file_type:
  image: {foreground: "#89a7b1"}
  video: {foreground: "#89a7b1"}
  music: {foreground: "#d5d5d5"}
  lossless: {foreground: "#89a7b1"}
  crypto: {foreground: "#566981"}
  document: {foreground: "#f5f5f5", is_bold: false}
  compressed: {foreground: "#89a7b1"}
  temp: {foreground: "#ff8a80"}
  compiled: {foreground: "#89a7b1"}
  build: {foreground: "#566981"}
  source: {foreground: "#89a7b1"}

punctuation: {foreground: "#f5f5f5", is_bold: false}
date: {foreground: "#89a7b1"}
inode: {foreground: "#d5d5d5"}
blocks: {foreground: "#566981"}
header: {foreground: "#f5f5f5", is_bold: false}
octal: {foreground: "#89a7b1"}
flags: {foreground: "#89a7b1"}

symlink_path: {foreground: "#89a7b1"}
control_char: {foreground: "#89a7b1"}
broken_symlink: {foreground: "#ff8a80"}
broken_path_overlay: {foreground: "#566981"}

filenames:
  # Custom filename-based overrides
  # Cargo.toml: {icon: {glyph: 🦀}}

extensions:
  # Custom extension-based overrides
  # rs: {filename: {foreground: Red}, icon: {glyph: 🦀}}
